name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "Tag ($tag) differs from manifest.json version ($version)"
            exit 1
          fi

      - name: Package extension
        run: |
          zip -r "eitri-cms-publisher-${GITHUB_REF_NAME}.zip" \
            manifest.json background.js panel.html panel.css panel.js src icons

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "eitri-cms-publisher-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
